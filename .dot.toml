# Personal development environments managed by dot.
# Each target is a complete environment declaration. Arch workstation profiles
# form one explicit base -> hyprland -> laptop inheritance path.


# Arch Linux personal workstation ---------------------------------------------

[targets.arch-linux]
platform = { os = "linux", distro = "arch" }

[targets.arch-linux.packages]

# Pacman packages by purpose
terminal-tools        = { provider = "pacman", names = ["zsh", "tmux", "zoxide", "fzf"] }
version-control-tools = { provider = "pacman", names = ["git", "lazygit", "git-delta"] }
file-search-tools     = { provider = "pacman", names = ["ripgrep", "fd", "yazi", "dust"] }
development-tools     = { provider = "pacman", names = ["cloc", "cmake", "just", "base-devel"] }
editors               = { provider = "pacman", names = ["neovim"] }
language-runtimes     = { provider = "pacman", names = ["python", "nodejs", "npm"] }
system-tools          = { provider = "pacman", names = ["btop", "xclip"] }

# Paru packages by purpose
container-tools       = { provider = "paru", names = ["lazydocker"] }
arch-packaging-tools  = { provider = "paru", names = ["debtap"] }

[targets.arch-linux.providers.pacman]
probe   = { program = "pacman", args = ["--version"] }
install = { program = "sudo", args = ["pacman", "-S", "--needed", "--noconfirm", "${package:names}"] }

[targets.arch-linux.providers.paru]
probe = { program = "paru", args = ["--version"] }
ensure = [
  { program = "sudo", args = ["pacman", "-S", "--needed", "--noconfirm", "base-devel", "git"] },
  { program = "rm", args = ["-rf", "/tmp/dot-paru"] },
  { program = "git", args = ["clone", "https://aur.archlinux.org/paru.git", "/tmp/dot-paru"] },
  { program = "makepkg", args = ["-si", "--noconfirm"], cwd = "/tmp/dot-paru" },
]
install = { program = "paru", args = ["-S", "--needed", "--noconfirm", "${package:names}"] }

[targets.arch-linux.links]
nvim            = { source = "${dot:real_config_dir}/home/.config/nvim", target = "${env:HOME}/.config/nvim" }
vim-config      = { source = "${dot:real_config_dir}/home/.config/vim/vimrc", target = "${env:HOME}/.config/vim/vimrc" }
vimrc           = { source = "${dot:real_config_dir}/home/.config/vim/vimrc", target = "${env:HOME}/.vimrc" }
yazi            = { source = "${dot:real_config_dir}/home/.config/yazi", target = "${env:HOME}/.config/yazi" }
lazygit         = { source = "${dot:real_config_dir}/home/.config/lazygit", target = "${env:HOME}/.config/lazygit" }
gitconfig       = { source = "${dot:real_config_dir}/home/.gitconfig", target = "${env:HOME}/.gitconfig" }
zshrc           = { source = "${dot:real_config_dir}/home/.zshrc", target = "${env:HOME}/.zshrc" }
tmux            = { source = "${dot:real_config_dir}/home/.tmux.conf", target = "${env:HOME}/.tmux.conf" }
tmux-local      = { source = "${dot:real_config_dir}/home/.tmux.conf.local", target = "${env:HOME}/.tmux.conf.local" }
alacritty       = { source = "${dot:real_config_dir}/home/.config/alacritty", target = "${env:HOME}/.config/alacritty" }

[targets.arch-linux.actions.setup-oh-my-zsh]
exec = { program = "bash", args = ["${dot:real_config_dir}/scripts/install_oh_my_zsh.sh"], cwd = "${dot:real_config_dir}" }

# Selecting `arch-linux/hyprland` inherits the command-line environment above.
[targets.arch-linux.profiles.hyprland.packages]

# Hyprland pacman packages by purpose
input-tools   = { provider = "pacman", names = ["fcitx5-im", "fcitx5-chinese-addons", "fcitx5-pinyin-zhwiki", "keyd"] }
desktop-fonts = { provider = "pacman", names = ["noto-fonts-cjk", "noto-fonts-emoji"] }
desktop-shell = { provider = "pacman", names = ["polkit-kde-agent", "swaync", "waybar", "hyprpaper", "nwg-displays"] }
network-tools = { provider = "pacman", names = ["nm-connection-editor", "network-manager-applet", "modemmanager"] }
wayland-tools = { provider = "pacman", names = ["grim", "slurp", "wl-clipboard"] }

# Hyprland paru packages by purpose
desktop-apps   = { provider = "paru", names = ["appimagelauncher", "google-chrome"] }
hyprland-tools = { provider = "paru", names = ["hyprshell-bin", "waypaper"] }

[targets.arch-linux.profiles.hyprland.links]
hypr            = { source = "${dot:real_config_dir}/home/.config/hypr", target = "${env:HOME}/.config/hypr" }
waybar          = { source = "${dot:real_config_dir}/home/.config/waybar", target = "${env:HOME}/.config/waybar" }
hyprshell       = { source = "${dot:real_config_dir}/home/.config/hyprshell", target = "${env:HOME}/.config/hyprshell" }
swaync          = { source = "${dot:real_config_dir}/home/.config/swaync", target = "${env:HOME}/.config/swaync" }
chrome-flags    = { source = "${dot:real_config_dir}/home/.config/chrome-flags.conf", target = "${env:HOME}/.config/chrome-flags.conf" }
chatgpt-desktop = { source = "${dot:real_config_dir}/home/.local/share/applications/chatgpt.desktop", target = "${env:HOME}/.local/share/applications/chatgpt.desktop" }

[targets.arch-linux.profiles.hyprland.profiles.laptop.packages]

# Laptop pacman packages by purpose
power-management-tools = { provider = "pacman", names = ["tlpui", "tlp", "tlp-pd"] }


# macOS workstation -----------------------------------------------------------

[targets.macos]
platform = { os = "macos" }

[targets.macos.packages]

# Brew formulae by purpose
terminal-tools        = { provider = "brew", names = ["zsh", "tmux", "zoxide", "fzf"] }
version-control-tools = { provider = "brew", names = ["git", "lazygit", "git-delta"] }
file-search-tools     = { provider = "brew", names = ["ripgrep", "fd", "yazi", "dust"] }
development-tools     = { provider = "brew", names = ["cloc", "cmake", "just"] }
editors               = { provider = "brew", names = ["neovim"] }
language-runtimes     = { provider = "brew", names = ["python", "node"] }
system-tools          = { provider = "brew", names = ["btop"] }
lisp-tools            = { provider = "brew", names = ["sbcl", "roswell"] }

# Brew casks by purpose
desktop-assets = { provider = "brew", names = ["sf-symbols", "font-hack-nerd-font"], provider_args = ["--cask"] }

[targets.macos.providers.brew]
activate = { path_prepend = ["/opt/homebrew/bin", "/usr/local/bin"] }
probe    = { program = "brew", args = ["--version"] }
ensure   = { program = "/bin/bash", args = ["-c", 'NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'] }
install  = { program = "brew", args = ["install", "${package:provider_args}", "${package:names}"] }

[targets.macos.links]
nvim       = { source = "${dot:real_config_dir}/home/.config/nvim", target = "${env:HOME}/.config/nvim" }
vim-config = { source = "${dot:real_config_dir}/home/.config/vim/vimrc", target = "${env:HOME}/.config/vim/vimrc" }
vimrc      = { source = "${dot:real_config_dir}/home/.config/vim/vimrc", target = "${env:HOME}/.vimrc" }
yazi       = { source = "${dot:real_config_dir}/home/.config/yazi", target = "${env:HOME}/.config/yazi" }
lazygit    = { source = "${dot:real_config_dir}/home/.config/lazygit", target = "${env:HOME}/.config/lazygit" }
gitconfig  = { source = "${dot:real_config_dir}/home/.gitconfig", target = "${env:HOME}/.gitconfig" }
zshrc      = { source = "${dot:real_config_dir}/home/.zshrc", target = "${env:HOME}/.zshrc" }
tmux       = { source = "${dot:real_config_dir}/home/.tmux.conf", target = "${env:HOME}/.tmux.conf" }
tmux-local = { source = "${dot:real_config_dir}/home/.tmux.conf.local", target = "${env:HOME}/.tmux.conf.local" }
alacritty  = { source = "${dot:real_config_dir}/home/.config/alacritty", target = "${env:HOME}/.config/alacritty" }

[targets.macos.actions.setup-oh-my-zsh]
exec = { program = "bash", args = ["${dot:real_config_dir}/scripts/install_oh_my_zsh.sh"], cwd = "${dot:real_config_dir}" }


# Windows workstation ---------------------------------------------------------

[targets.windows]
platform = { os = "windows" }

[targets.windows.packages]

# Scoop packages by purpose
terminal-tools        = { provider = "scoop", names = ["pwsh", "starship", "zoxide", "fzf", "zellij"] }
version-control-tools = { provider = "scoop", names = ["git", "lazygit", "delta"] }
file-search-tools     = { provider = "scoop", names = ["ripgrep", "fd", "yazi", "dust", "bat", "everything"] }
development-tools     = { provider = "scoop", names = ["cloc", "cmake", "just"] }
editors               = { provider = "scoop", names = ["neovim", "vscode", "vim"] }
language-runtimes     = { provider = "scoop", names = ["python", "nodejs"] }
container-tools       = { provider = "scoop", names = ["lazydocker"] }
fonts                 = { provider = "scoop", names = ["Hack-NF"] }

[targets.windows.providers.scoop]
activate = { path_prepend = ["${env:USERPROFILE}/scoop/shims"] }
probe = { program = "powershell.exe", args = ["-NoProfile", "-Command", "if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) { exit 1 }; $root = if ($env:SCOOP) { $env:SCOOP } else { Join-Path $env:USERPROFILE 'scoop' }; if ((Test-Path (Join-Path $root 'buckets\\extras')) -and (Test-Path (Join-Path $root 'buckets\\nerd-fonts'))) { exit 0 }; exit 1"] }
ensure = { program = "powershell.exe", args = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) { Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force; Invoke-RestMethod get.scoop.sh | Invoke-Expression }; $root = if ($env:SCOOP) { $env:SCOOP } else { Join-Path $env:USERPROFILE 'scoop' }; if (-not (Test-Path (Join-Path $root 'buckets\\extras'))) { scoop bucket add extras }; if (-not (Test-Path (Join-Path $root 'buckets\\nerd-fonts'))) { scoop bucket add nerd-fonts }"] }

install = { program = "powershell.exe", args = ["-NoProfile", "-File", "${env:USERPROFILE}/scoop/apps/scoop/current/bin/scoop.ps1", "install", "${package:names}"] }

[targets.windows.links]
nvim               = { source = '${dot:real_config_dir}\home\.config\nvim', target = "${env:LOCALAPPDATA}/nvim" }
vimrc              = { source = '${dot:real_config_dir}\home\.config\vim\vimrc', target = "${env:USERPROFILE}/_vimrc" }
yazi               = { source = '${dot:real_config_dir}\home\.config\yazi', target = "${env:APPDATA}/yazi/config" }
lazygit            = { source = '${dot:real_config_dir}\home\.config\lazygit', target = "${env:LOCALAPPDATA}/lazygit" }
alacritty          = { source = '${dot:real_config_dir}\home\.config\alacritty', target = "${env:APPDATA}/alacritty" }
gitconfig          = { source = '${dot:real_config_dir}\home\.gitconfig', target = "${env:USERPROFILE}/.gitconfig" }
starship           = { source = '${dot:real_config_dir}\home\.config\starship.toml', target = "${env:USERPROFILE}/.config/starship.toml" }
powershell-profile = { source = '${dot:real_config_dir}\home\.config\powershell\profile.ps1', target = "${xdg:documents}/PowerShell/profile.ps1" }

# Only reconcile variants whose application-owned parent exists.
terminal-local   = { source = '${dot:real_config_dir}\home\.config\windows-terminal\settings.json', target = "${env:LOCALAPPDATA}/Microsoft/Windows Terminal/settings.json", on_missing_parent = "skip" }
terminal-stable  = { source = '${dot:real_config_dir}\home\.config\windows-terminal\settings.json', target = "${env:LOCALAPPDATA}/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json", on_missing_parent = "skip" }
terminal-preview = { source = '${dot:real_config_dir}\home\.config\windows-terminal\settings.json', target = "${env:LOCALAPPDATA}/Packages/Microsoft.WindowsTerminalPreview_8wekyb3d8bbwe/LocalState/settings.json", on_missing_parent = "skip" }
# terminal-canary  = { source = '${dot:real_config_dir}\home\.config\windows-terminal\settings.json', target = "${env:LOCALAPPDATA}/Packages/Microsoft.WindowsTerminalCanary_8wekyb3d8bbwe/LocalState/settings.json", on_missing_parent = "skip" }
